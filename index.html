<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse — Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;--bg:light-dark(#f5f7fb,#0e1117);--panel:light-dark(#fff,#151a22);--panel2:light-dark(#f0f3f8,#1c222d);--text:light-dark(#111827,#f4f7fb);--muted:light-dark(#6b7280,#9aa4b2);--line:light-dark(#e5e9f0,#29313d);--accent:#5b67f1;--bubble:light-dark(#edf0ff,#26305f);--danger:#ef4444;--ok:#35a16f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:330px 1fr;overflow:hidden}.sidebar,.header,.composer,.auth-card,.modal-card{background:var(--panel)}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:20px}.logo,.auth-logo{background:var(--accent);color:#fff;display:grid;place-items:center}.logo{width:34px;height:34px;border-radius:11px}.search{margin:0 16px 14px;display:flex;background:var(--panel2);border-radius:13px;padding:9px 12px;gap:8px}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.section-title{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;color:var(--muted);font-size:12px}.new-chat{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:6px 9px;cursor:pointer}.chats{overflow:auto;flex:1}.chat{display:flex;gap:12px;padding:13px 17px;cursor:pointer}.chat:hover,.chat.active{background:var(--panel2)}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#a9b5ff,#626ff4);color:#fff;flex:0 0 auto}.chatmain{min-width:0;flex:1}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.time,.preview{font-size:12px;color:var(--muted)}.preview{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{display:flex;flex-direction:column;min-width:0}.header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.status{font-size:12px;color:var(--ok)}.messages{flex:1;overflow:auto;padding:28px 8%;background:var(--bg)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-box{max-width:500px}.empty-box .big{font-size:48px;margin-bottom:12px}.day{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 18px}.msg{display:flex;margin:8px 0}.msg.me{justify-content:flex-end}.bubble{max-width:min(650px,72%);padding:11px 14px;border-radius:17px;background:var(--panel);border:1px solid var(--line);line-height:1.4}.me .bubble{background:var(--bubble);border-color:transparent}.meta{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}.composer{padding:15px 8%;border-top:1px solid var(--line);display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:0;border-radius:15px;padding:12px 14px}.send{border:0;background:var(--accent);color:#fff;border-radius:13px;padding:0 18px;font-weight:700;cursor:pointer}.account{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:16px}.account .small{font-size:12px;color:var(--muted)}.logout{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:7px 9px;cursor:pointer}.auth-overlay,.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(8,12,20,.75);backdrop-filter:blur(10px)}.modal{display:none;z-index:80}.auth-card,.modal-card{width:min(460px,100%);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.modal-card{border-radius:20px}.auth-logo{width:48px;height:48px;border-radius:14px;font-weight:900;font-size:22px;margin-bottom:18px}.auth-card h1,.modal-card h2{margin:0 0 8px}.auth-card p{margin:0 0 24px;color:var(--muted)}.auth-field,.field{display:block;margin:14px 0}.auth-field span,.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.auth-field input,.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);outline:none}.auth-submit,.primary{width:100%;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.auth-switch{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:10px 0}.auth-error{min-height:20px;color:var(--danger);font-size:13px;margin-top:10px}.user-result{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer}.user-result:hover{background:var(--panel2)}.user-result .avatar{width:40px;height:40px}.users{max-height:330px;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--panel2);color:var(--text)}.hint{font-size:12px;color:var(--muted);margin-top:8px}.hidden{display:none!important}.mobile-menu{display:none}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-menu{display:block}.messages{padding:22px 14px}.composer{padding:12px}.header{padding:0 12px}.bubble{max-width:82%}}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">P</div>
    <h1 id="authTitle">Войти в Pulse</h1>
    <p id="authSubtitle">Войдите в аккаунт, чтобы общаться с другими пользователями.</p>
    <form id="authForm">
      <label class="auth-field hidden" id="nameField"><span>Имя</span><input id="regName" minlength="2" autocomplete="name" placeholder="Например, Кирилл"></label>
      <label class="auth-field"><span>Email</span><input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label>
      <label class="auth-field"><span>Пароль</span><input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="Минимум 6 символов"></label>
      <div class="auth-error" id="authError"></div>
      <button class="auth-submit" id="authSubmit">Войти</button>
    </form>
    <button class="auth-switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✦</div>Pulse</div>
    <div class="search">⌕<input id="chatSearch" placeholder="Поиск чатов…"></div>
    <div class="section-title"><span>Мои чаты</span><button class="new-chat" id="newChatBtn">+ Новый чат</button></div>
    <div class="chats" id="chats"></div>
    <div class="account">
      <div class="avatar" id="myAvatar">Я</div>
      <div><strong id="myName">Гость</strong><div class="small" id="myEmail">Не выполнен вход</div></div>
      <button class="logout" id="logoutBtn">Выйти</button>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="icon mobile-menu" id="mobileMenu">☰</button>
      <div class="avatar" id="headAvatar">P</div>
      <div><div class="name" id="headName">Pulse Messenger</div><div class="status">● готов к общению</div></div>
    </header>
    <section class="messages" id="messages">
      <div class="empty"><div class="empty-box"><div class="big">💬</div><h2>Выберите чат</h2><p>Создайте личный чат с другим пользователем Pulse.</p></div></div>
    </section>
    <form class="composer" id="composer">
      <input id="input" autocomplete="off" placeholder="Выберите чат…">
      <button class="send" id="sendButton">Отправить</button>
    </form>
  </main>
</div>

<div class="modal" id="userModal">
  <div class="modal-card">
    <h2>Новый личный чат</h2>
    <div class="field"><label>Найти пользователя по email</label><input id="userSearch" type="email" placeholder="email пользователя"></div>
    <div class="users" id="userResults"></div>
    <div class="modal-actions"><button class="secondary" id="closeModal">Закрыть</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bdxgmsrdhiybsicmkyaf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8Y0uywiF6TWH3m8OHEAz5A_E9HoccMc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let activeChat = null;
let chats = [];
let realtimeChannel = null;
let authMode = 'login';
let searchTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
const time = d => new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

function showError(message){ $('authError').textContent = message || ''; }

function friendlyError(error){
  const m = error?.message || String(error || '');
  if(m.toLowerCase().includes('failed to fetch')) return 'Не удаётся подключиться к Supabase. Проверьте интернет/VPN/расширения браузера.';
  return m || 'Неизвестная ошибка.';
}

function setAuthMode(mode){
  authMode = mode;
  const register = mode === 'register';
  $('authTitle').textContent = register ? 'Создать аккаунт' : 'Войти в Pulse';
  $('authSubtitle').textContent = register ? 'Создайте аккаунт и начинайте общаться с другими пользователями.' : 'Войдите в аккаунт, чтобы общаться с другими пользователями.';
  $('nameField').classList.toggle('hidden', !register);
  $('regName').required = register;
  $('authSubmit').textContent = register ? 'Зарегистрироваться' : 'Войти';
  $('authSwitch').textContent = register ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
  $('authPassword').autocomplete = register ? 'new-password' : 'current-password';
  showError('');
}

$('authSwitch').onclick = () => setAuthMode(authMode === 'login' ? 'register' : 'login');

$('authForm').onsubmit = async e => {
  e.preventDefault();
  showError('');
  $('authSubmit').disabled = true;
  const email = $('authEmail').value.trim().toLowerCase();
  const password = $('authPassword').value;
  try{
    if(authMode === 'register'){
      const name = $('regName').value.trim();
      if(name.length < 2) throw new Error('Введите имя минимум из 2 символов.');
      const {data,error} = await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin + location.pathname}});
      if(error) throw error;
      if(!data.session){
        alert('Регистрация создана. Подтвердите email по ссылке из письма, затем войдите.');
        setAuthMode('login');
        $('authEmail').value = email;
        return;
      }
      await boot(data.user);
    }else{
      const {data,error} = await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      await boot(data.user);
    }
  }catch(error){
    showError(friendlyError(error));
  }finally{
    $('authSubmit').disabled = false;
  }
};

async function boot(user){
  currentUser = user;
  const {data:profile,error} = await sb.from('profiles').select('id,email,display_name').eq('id',user.id).maybeSingle();
  if(error) throw error;
  currentProfile = profile || {id:user.id,email:user.email,display_name:user.user_metadata?.display_name || user.email.split('@')[0]};
  $('authOverlay').style.display = 'none';
  $('myName').textContent = currentProfile.display_name;
  $('myEmail').textContent = currentProfile.email;
  $('myAvatar').textContent = (currentProfile.display_name || 'Я').trim().charAt(0).toUpperCase();
  await loadChats();
}

async function loadChats(){
  if(!currentUser) return;
  const {data:members,error} = await sb.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);
  if(error) throw new Error('Не удалось загрузить чаты: ' + friendlyError(error));
  const ids = [...new Set((members || []).map(x => x.conversation_id))];
  if(!ids.length){ chats=[]; renderChats(); return; }
  const {data:conversations,error:convError} = await sb.from('conversations').select('id,created_at').in('id',ids).order('created_at',{ascending:false});
  if(convError) throw convError;
  const rows = conversations || [];
  chats = [];
  for(const conversation of rows){
    const {data:otherMembers,error:memberError} = await sb.from('conversation_members').select('user_id').eq('conversation_id',conversation.id).neq('user_id',currentUser.id).limit(1);
    if(memberError) continue;
    const otherId = otherMembers?.[0]?.user_id;
    if(!otherId) continue;
    const {data:other} = await sb.from('profiles').select('id,email,display_name').eq('id',otherId).maybeSingle();
    const {data:last} = await sb.from('messages').select('body,created_at').eq('conversation_id',conversation.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
    chats.push({conversation,other,last});
  }
  renderChats();
  if(activeChat){
    const refreshed = chats.find(x => x.conversation.id === activeChat.conversation.id);
    if(refreshed) activeChat = refreshed; else {
      activeChat = null;
      stopRealtime();
      renderMessages();
    }
  }
}

function renderChats(){
  const q = $('chatSearch').value.trim().toLowerCase();
  $('chats').innerHTML = chats.filter(x => {
    const n = x.other?.display_name || x.other?.email || '';
    return n.toLowerCase().includes(q);
  }).map(x => {
    const n = x.other?.display_name || x.other?.email || 'Пользователь';
    return '<div class="chat ' + (activeChat?.conversation.id === x.conversation.id ? 'active' : '') + '" data-id="' + x.conversation.id + '">' +
      '<div class="avatar">' + esc(n.charAt(0).toUpperCase()) + '</div>' +
      '<div class="chatmain"><div class="row"><span class="name">' + esc(n) + '</span><span class="time">' + (x.last ? time(x.last.created_at) : '') + '</span></div>' +
      '<div class="preview">' + esc(x.last?.body || 'Новый чат') + '</div></div></div>';
  }).join('');
  [...$('chats').querySelectorAll('.chat')].forEach(el => el.onclick = () => {
    const x = chats.find(c => c.conversation.id === el.dataset.id);
    if(x) selectChat(x);
  });
}

$('chatSearch').oninput = renderChats;

async function selectChat(chat){
  activeChat = chat;
  $('headName').textContent = chat.other?.display_name || chat.other?.email || 'Пользователь';
  $('headAvatar').textContent = (chat.other?.display_name || chat.other?.email || 'P').charAt(0).toUpperCase();
  await loadMessages();
  renderChats();
  subscribeRealtime();
  $('input').focus();
}

async function loadMessages(){
  if(!activeChat) { renderMessages(); return; }
  const {data,error} = await sb.from('messages').select('id,body,created_at,sender_id').eq('conversation_id',activeChat.conversation.id).order('created_at',{ascending:true});
  if(error){ $('messages').innerHTML = '<div class="empty"><div class="empty-box"><h2>Ошибка загрузки</h2><p>' + esc(friendlyError(error)) + '</p></div></div>'; return; }
  const list = data || [];
  $('messages').innerHTML = '<div class="day">История сообщений</div>' + (list.length ? list.map(m =>
    '<div class="msg ' + (m.sender_id === currentUser.id ? 'me' : '') + '"><div class="bubble">' +
    esc(m.body) + '<div class="meta">' + time(m.created_at) + (m.sender_id === currentUser.id ? ' · ✓✓' : '') + '</div></div></div>'
  ).join('') : '<div class="empty" style="min-height:60%"><div class="empty-box"><div class="big">💬</div><p>Сообщений пока нет. Напишите первым.</p></div></div>');
  $('messages').scrollTop = $('messages').scrollHeight;
}

function renderMessages(){
  if(!activeChat){
    $('messages').innerHTML = '<div class="empty"><div class="empty-box"><div class="big">💬</div><h2>Выберите чат</h2><p>Создайте личный чат с другим пользователем Pulse.</p></div></div>';
    $('headName').textContent = 'Pulse Messenger';
    $('headAvatar').textContent = 'P';
    $('input').placeholder = 'Выберите чат…';
    return;
  }
  $('input').placeholder = 'Напишите сообщение…';
}

function stopRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}

function subscribeRealtime(){
  stopRealtime();
  if(!activeChat) return;
  realtimeChannel = sb.channel('pulse-chat-' + activeChat.conversation.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.' + activeChat.conversation.id},payload => {
      const m = payload.new;
      if(m.sender_id === currentUser.id) return;
      const wrap = document.createElement('div');
      wrap.className = 'msg';
      wrap.innerHTML = '<div class="bubble">' + esc(m.body) + '<div class="meta">' + time(m.created_at) + '</div></div>';
      $('messages').appendChild(wrap);
      $('messages').scrollTop = $('messages').scrollHeight;
      loadChats().catch(console.error);
    }).subscribe();
}

$('composer').onsubmit = async e => {
  e.preventDefault();
  if(!activeChat) return;
  const body = $('input').value.trim();
  if(!body) return;
  $('input').value = '';
  const {data,error} = await sb.from('messages').insert({conversation_id:activeChat.conversation.id,sender_id:currentUser.id,body}).select().single();
  if(error){ $('input').value = body; alert(friendlyError(error)); return; }
  const m = data;
  const wrap = document.createElement('div');
  wrap.className = 'msg me';
  wrap.innerHTML = '<div class="bubble">' + esc(m.body) + '<div class="meta">' + time(m.created_at) + ' · ✓✓</div></div>';
  if(!$('messages').querySelector('.msg')) $('messages').innerHTML = '';
  $('messages').appendChild(wrap);
  $('messages').scrollTop = $('messages').scrollHeight;
  await loadChats();
};

$('newChatBtn').onclick = () => {
  $('userModal').style.display = 'grid';
  $('userSearch').value = '';
  $('userResults').innerHTML = '<div class="hint">Введите email пользователя Pulse.</div>';
  $('userSearch').focus();
};
$('closeModal').onclick = () => $('userModal').style.display = 'none';

$('userSearch').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchUsers,300);
};

async function searchUsers(){
  const q = $('userSearch').value.trim().toLowerCase();
  if(q.length < 3){ $('userResults').innerHTML = '<div class="hint">Введите минимум 3 символа.</div>'; return; }
  const {data,error} = await sb.from('profiles').select('id,email,display_name').ilike('email','%' + q + '%').limit(10);
  if(error){ $('userResults').innerHTML = '<div class="hint">' + esc(friendlyError(error)) + '</div>'; return; }
  const users = (data || []).filter(u => u.id !== currentUser.id);
  $('userResults').innerHTML = users.length ? users.map(u =>
    '<div class="user-result" data-id="' + u.id + '"><div class="avatar">' + esc((u.display_name || u.email).charAt(0).toUpperCase()) + '</div><div><strong>' + esc(u.display_name) + '</strong><div class="hint">' + esc(u.email) + '</div></div></div>'
  ).join('') : '<div class="hint">Пользователь не найден.</div>';
  [...$('userResults').querySelectorAll('.user-result')].forEach(el => el.onclick = () => {
    const user = users.find(u => u.id === el.dataset.id);
    if(user) startChat(user);
  });
}

async function startChat(other){
  if(!currentUser || !other?.id) return;

  const {data:myRows,error:myErr} = await sb.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);
  if(myErr){ alert(friendlyError(myErr)); return; }
  const myIds = (myRows || []).map(x => x.conversation_id);
  let conversation = null;

  if(myIds.length){
    const {data:common,error:commonErr} = await sb.from('conversation_members').select('conversation_id').eq('user_id',other.id).in('conversation_id',myIds);
    if(commonErr){ alert(friendlyError(commonErr)); return; }
    const commonId = common?.[0]?.conversation_id;
    if(commonId){
      const {data:c,error:cErr} = await sb.from('conversations').select('id,created_at').eq('id',commonId).maybeSingle();
      if(cErr){ alert(friendlyError(cErr)); return; }
      conversation = c;
    }
  }

  if(!conversation){
    const {data:newConversation,error:createErr} = await sb.from('conversations').insert({}).select('id,created_at').single();
    if(createErr){ alert(friendlyError(createErr)); return; }
    conversation = newConversation;

    const {error:myMemberErr} = await sb.from('conversation_members').insert({conversation_id:conversation.id,user_id:currentUser.id});
    if(myMemberErr){ alert(friendlyError(myMemberErr)); return; }

    const {error:otherMemberErr} = await sb.from('conversation_members').insert({conversation_id:conversation.id,user_id:other.id});
    if(otherMemberErr){ alert(friendlyError(otherMemberErr)); return; }
  }

  $('userModal').style.display = 'none';
  await loadChats();
  const chat = chats.find(x => x.conversation.id === conversation.id);
  if(chat) await selectChat(chat);
}

$('logoutBtn').onclick = async () => { stopRealtime(); await sb.auth.signOut(); location.reload(); };

$('mobileMenu').onclick = () => {
  const side = document.querySelector('.sidebar');
  if(getComputedStyle(side).display === 'none') side.style.display='flex';
  else side.style.display='none';
};

sb.auth.onAuthStateChange((_event,session) => {
  if(session && !currentUser) boot(session.user).catch(e => showError(friendlyError(e)));
});

(async function init(){
  setAuthMode('login');
  try{
    const {data,error} = await sb.auth.getSession();
    if(error) throw error;
    if(data.session) await boot(data.session.user);
    else $('authOverlay').style.display = 'grid';
  }catch(error){
    $('authOverlay').style.display = 'grid';
    showError(friendlyError(error));
  }
})();
</script>
</body>
</html>
